# sops-fulla 的测试、多平台打包与发布
#
# 这是工具自己的仓库：任何变更推上 master 都会跑测试并打包全部平台发
# Release；PR 只跑测试与打包验证不发版；打 v* tag 时以 tag 名作为版本号
# 测试自带原生加解密回归，runner 上不需要 sops / age / Python
#
# [EN] Test, build and release for sops-fulla. Every push to master runs the
# tests, builds all platforms and publishes a Release; PRs only verify; v* tags
# set the version. Tests carry native encryption round-trips, so the runner
# needs no sops / age / Python.
name: 📦 构建发布

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 发 Release 需要写权限

jobs:
  test:
    name: 🧪 测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "以下文件未通过 gofmt：" >&2
            printf '  %s\n' ${unformatted} >&2
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试（含原生加解密往返）
        run: go test ./... -v

      # 真实密文格式回归：上游配置仓库的密文由 sops CLI 生成，
      # 原生实现必须能按同一格式解析这里先加密一份样本
      # （复用 examples 的公开演示密钥对，runner 无需任何外部工具），
      # 再交给回归用例按「外部密文」解析
      # 注意私钥要用绝对路径：go test 的工作目录是 service/ 子目录
      - name: 真实密文格式回归
        env:
          SOPS_AGE_KEY_FILE: ${{ github.workspace }}/examples/basic/demo-key.txt
        run: |
          mkdir -p /tmp/real-shape/demo/dev
          printf 'creation_rules:\n  - path_regex: \\.enc\\.(yaml|yml|json)$\n    age: age1kxev2e0g0r6a4km5x5rmadrfrkqgv0navtnn5xy4fdsa5cj56q7qj6pfq5\n' > /tmp/real-shape/.sops.yaml
          printf 'TOKEN: shape-check\n' > /tmp/real-shape/demo/dev/secrets.enc.yaml
          go run . --repo /tmp/real-shape encrypt
          FULLA_REAL_CIPHERTEXT=/tmp/real-shape/demo/dev/secrets.enc.yaml \
            go test ./service/ -run TestRealCiphertextParses -v

  build:
    name: 📦 打包 ${{ matrix.os }}-${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建二进制
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          version="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          output="dist/sops-fulla-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            output="${output}.exe"
          fi
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.Version=${version}" \
            -o "${output}" .
          echo "version=${version}" >> "$GITHUB_ENV"

      # UPX 压缩：sops 官方库带了不少依赖，Go 二进制默认偏大，
      # 压缩后通常缩小 60% 以上UPX 5.x 不支持 macOS（darwin 跳过），
      # linux / windows 全覆盖
      - name: 缓存 upx
        if: matrix.os != 'darwin'
        uses: actions/cache@v4
        with:
          path: ~/.cache/upx
          key: upx-5.0.2-amd64-linux
      - name: UPX 压缩
        if: matrix.os != 'darwin'
        run: |
          if [ ! -x "$HOME/.cache/upx/upx" ]; then
            mkdir -p "$HOME/.cache/upx"
            curl -sSL --retry 3 \
              https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-amd64_linux.tar.xz \
              | tar -xJ -C /tmp
            cp /tmp/upx-5.0.2-amd64_linux/upx "$HOME/.cache/upx/upx"
          fi
          "$HOME/.cache/upx/upx" --version | head -n 1
          echo "--- 压缩前 ---"
          ls -l dist/
          "$HOME/.cache/upx/upx" --best --lzma dist/*
          echo "--- 压缩后 ---"
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sops-fulla-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 🚀 发布 Release
    needs: build
    # 只在推送到 master（含合并）或打 v* tag 时发布；PR 只跑测试和打包验证
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        working-directory: dist
        run: sha256sum sops-fulla-* > checksums.txt

      - name: 计算版本号
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            sha="$(echo '${{ github.sha }}' | cut -c1-7)"
            echo "name=${sha}" >> "$GITHUB_OUTPUT"
            echo "tag=sops-fulla-${sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: sops-fulla ${{ steps.version.outputs.name }}
          body: |
            本地配置仓库管理工具（页面 + 密文批量命令）的自动构建产物

            ## 产物

            | 文件 | 平台 |
            |---|---|
            | `sops-fulla-darwin-amd64` | macOS (Intel) |
            | `sops-fulla-darwin-arm64` | macOS (Apple Silicon) |
            | `sops-fulla-linux-amd64` | Linux x86_64 |
            | `sops-fulla-linux-arm64` | Linux ARM64 |
            | `sops-fulla-windows-amd64.exe` | Windows x86_64 |
            | `checksums.txt` | SHA-256 校验和 |

            ## 使用

            单二进制，**不需要安装 sops / age / Python**；
            linux / windows 产物已用 UPX 压缩（运行时自解压，体积约为原来的 1/5）：

            ```bash
            chmod +x sops-fulla-darwin-arm64   # 按平台选择
            ./sops-fulla-darwin-arm64 --repo /path/to/config-repo
            ```

            配置仓库要求：任意目录层级放置 `*.yaml|json` + `.sops.yaml` 加密规则；
            密钥文件名不同时加 `--secrets-name <文件名>` 适配
            age 私钥在页面左下角填写（优先），或配 `SOPS_AGE_KEY` /
            `SOPS_AGE_KEY_FILE` / 本机密钥文件

            触发提交：${{ github.event.head_commit.message }}
          files: dist/*
          generate_release_notes: false
